<!DOCTYPE html>
<html lang="vi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#120d0a"><title>Quản trị | Chùa Sen Vàng</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;padding:28px;background:radial-gradient(ellipse at 20% 0,#35251a,#120d0a 65%);color:#f7f0e5;font-family:system-ui,-apple-system,sans-serif}.wrap{max-width:760px;margin:auto}.head,.card{border:1px solid rgba(220,178,104,.2);border-radius:18px;background:#211710;padding:22px;margin-bottom:14px}.eyebrow{font-size:10px;letter-spacing:.16em;color:#c7a36d;font-weight:800}h1{font-size:25px;margin:8px 0;color:#f3dfba}p{color:#b9a993;font-size:13px;line-height:1.6}.row{display:flex;gap:10px;flex-wrap:wrap}.btn{border:1px solid rgba(215,173,104,.3);border-radius:10px;background:#6b4a29;color:#fff0d2;padding:11px 15px;font-weight:700;cursor:pointer}.btn.secondary{background:#19120d;color:#e9d5b4}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.stat{padding:14px;border-radius:12px;background:#17110d}.stat small{display:block;color:#b9a993}.stat b{display:block;color:#f3dfba;font-size:20px;margin-top:5px}a{color:#d8b57c;text-decoration:none}@media(max-width:500px){body{padding:14px}.head,.card{padding:17px}.stats{grid-template-columns:1fr 1fr}}</style></head>
<body><main class="wrap"><header class="head"><div class="eyebrow">CHÙA SEN VÀNG ONLINE</div><h1>Quản trị hệ thống</h1><p>Quản lý dữ liệu hành lễ và kiểm tra dịch vụ âm thanh.</p><div class="row"><a class="btn secondary" href="/">← Trở về Chánh điện</a><button class="btn" id="refresh">Làm mới dữ liệu</button></div></header><section class="card"><div class="eyebrow">THỐNG KÊ HÀNH LỄ</div><div class="stats"><div class="stat"><small>Nén hương</small><b id="incense">—</b></div><div class="stat"><small>Công đức</small><b id="merit">—</b></div><div class="stat"><small>Nhịp mõ</small><b id="fish">—</b></div></div></section><section class="card"><div class="eyebrow">DỮ LIỆU</div><p id="status">Đang tải trạng thái…</p><div class="row"><button class="btn secondary" id="reset">Đặt lại thống kê công đức</button></div></section></main>
<script>
async function rpc(method,params={}){const r=await fetch('/rpc',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({jsonrpc:'2.0',id:Date.now(),method,params})});const j=await r.json();if(j.error)throw new Error(j.error.message||'Yêu cầu thất bại');return j.result}
async function refresh(){try{const s=await rpc('temple.getState');document.getElementById('incense').textContent=Number(s.totalIncense||0).toLocaleString('vi-VN');document.getElementById('merit').textContent=Number(s.totalMerit||0).toLocaleString('vi-VN');document.getElementById('fish').textContent=Number(s.woodenFishHits||0).toLocaleString('vi-VN');document.getElementById('status').textContent='Máy chủ đang hoạt động. Dữ liệu đã được đồng bộ.'}catch(e){document.getElementById('status').textContent='Không thể tải dữ liệu: '+e.message}}
document.getElementById('refresh').onclick=refresh;document.getElementById('reset').onclick=async()=>{if(!confirm('Đặt lại toàn bộ thống kê công đức?'))return;try{await rpc('temple.resetMerit');await refresh()}catch(e){alert(e.message)}};refresh();
</script></body></html>
